# CoinCall on Render — API + Host web + Admin
# Dashboard → New → Blueprint → connect repo CoinCall → Deploy Blueprint
# Set secret env values when prompted (sync: false).

services:
  # Backend: Agora tokens + call bridge (user ↔ host)
  - type: web
    name: coincall-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # MongoDB Atlas — durable cloud DB for wallets / DMs / host profiles
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: coincall
      - key: API_PUBLIC_URL
        value: https://coincall-api.onrender.com
      - key: PUBLIC_API_URL
        value: https://coincall-api.onrender.com
      - key: DATA_DIR
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.zuko.user
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYMENT_DATA_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_PUBLIC_WEB_URL
        value: https://luma-user.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_VERIFICATION_TOKEN
        sync: false
      - key: ALLOW_IAP_STUB
        value: "0"
      - key: FIREBASE_PROJECT_ID
        value: lovecall-2291e

  # Host app (Expo web export) — hosts Go Online & accept Luma calls
  # EXPO_PUBLIC_* must be set in the dashboard (baked at build). Code also
  # ships public Firebase/Agora fallbacks so login works if env is missing.
  - type: web
    name: coincall-host
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://coincall-api.onrender.com/api
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_DATABASE_URL
        sync: false
      - key: EXPO_PUBLIC_AGORA_APP_ID
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

  # Admin panel
  - type: web
    name: coincall-admin
    runtime: static
    plan: free
    region: oregon
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://coincall-api.onrender.com/api
      - key: VITE_ADMIN_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      - key: VITE_AGORA_APP_ID
        sync: false

  # Fan / user app (Luma) — lists CoinCall hosts & 1v1 calls
  - type: web
    name: luma-user
    runtime: node
    plan: free
    region: oregon
    rootDir: luma-user
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://coincall-api.onrender.com/api
      - key: NEXT_PUBLIC_AGORA_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyBzFRXeuDvjq6RG5VR4oky0Ra93AvVFZ50
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: lovecall-2291e.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: lovecall-2291e
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: lovecall-2291e.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "469302066716"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:469302066716:web:79d8e7bce979bcf17529d9
